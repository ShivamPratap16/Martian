<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Claim Mars Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #0c0908; --card: #1a1310; --line: rgba(255, 220, 190, 0.14); --ink: #f4ebe3; --muted: #a8988b; --accent: #ff7a3d; --ok: #9be29b; --bad: #ff8f8f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; }
      main { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
      h1 { font-size: 22px; letter-spacing: 0.12em; }
      button, input { font: inherit; color: inherit; }
      input { background: #000; border: 1px solid var(--line); border-radius: 8px; padding: 10px; width: 100%; }
      .btn { border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; background: var(--accent); color: #1a0e08; font-weight: 600; }
      .btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
      .btn.bad { background: none; border: 1px solid var(--bad); color: var(--bad); }
      .hidden { display: none !important; }
      #login { max-width: 360px; display: grid; gap: 10px; }
      .tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
      .tabs .btn[aria-pressed='false'] { background: none; border: 1px solid var(--line); color: var(--ink); }
      .row { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 10px; }
      .row img { width: 64px; height: 64px; object-fit: contain; background: #faf4ee; border-radius: 10px; padding: 6px; }
      .row .meta { color: var(--muted); font-size: 12px; word-break: break-all; }
      .row .desc { font-size: 14px; margin: 4px 0; }
      .row a { color: var(--accent); }
      .actions { display: flex; flex-direction: column; gap: 6px; }
      .msg { color: var(--muted); }
      .err { color: var(--bad); }
      @media (max-width: 560px) { .row { grid-template-columns: 48px 1fr; } .row img { width: 48px; height: 48px; } .actions { grid-column: 1 / -1; flex-direction: row; } }
    </style>
  </head>
  <body>
    <main>
      <h1>CLAIM MARS · ADMIN</h1>

      <form id="login" class="hidden">
        <p class="msg">Sign in with the admin account you created in Supabase (Authentication → Users).</p>
        <input id="email" type="email" placeholder="Email" autocomplete="username" required />
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
        <button class="btn" type="submit">Sign in</button>
        <div id="login-error" class="err"></div>
      </form>

      <section id="app" class="hidden">
        <div class="tabs">
          <button class="btn" data-tab="pending" aria-pressed="true">Waiting for review</button>
          <button class="btn" data-tab="approved" aria-pressed="false">Live plots</button>
          <button class="btn ghost" id="refresh">Refresh</button>
          <button class="btn ghost" id="signout">Sign out</button>
        </div>
        <p id="status" class="msg"></p>
        <div id="list"></div>
      </section>
    </main>
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
